<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房东意向后台｜易客居</title>
<style>
:root{--ink:#20231f;--muted:#697168;--paper:#f5f6f2;--line:#e1e5dd;--green:#526b58}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;width:94%;margin:32px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:28px;margin:0}p{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field input,.field select,.field textarea{padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.btn{border:0;background:var(--green);color:white;border-radius:9px;padding:11px 16px;font-weight:650;cursor:pointer}.btn.secondary{background:#e9eee7;color:#314b37}.btn.danger{background:#8c3c32}.btn:disabled{opacity:.6}.hidden{display:none!important}.message{font-size:13px;margin-top:12px;white-space:pre-wrap}.error{color:#9a3027}.ok{color:#245b31}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0eb;vertical-align:top}th{color:#596258;background:#fafbf8}td textarea{min-width:150px;width:100%;border:1px solid var(--line);border-radius:7px;padding:7px;font:inherit}td select{padding:7px;border:1px solid var(--line);border-radius:7px}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:14px 18px;background:#f7f8f5;border-radius:12px;min-width:120px}.stat b{display:block;font-size:23px}.loginbox{max-width:420px;margin:60px auto}.note{background:#fff7e6;padding:12px;border-radius:10px;font-size:13px;color:#72571d}
</style></head><body><div class="wrap">
<div class="top"><div><div class="small">易客居 · 管理工具</div><h1>房东合作意向</h1><p>仅授权管理员可查看提交的联系信息。</p></div><button class="btn secondary hidden" id="logoutBtn">退出登录</button></div>
<div id="setupWarning" class="panel note hidden"></div>
<div id="loginPanel" class="panel loginbox"><h2>管理员登录</h2><p>使用你在 Supabase 后台创建的管理员账号。</p><form id="loginForm"><div class="field"><label>管理员邮箱</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>密码</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit" id="loginBtn">登录后台</button><div id="loginMsg" class="message"></div></form><p class="small">为避免陌生人注册，请在 Supabase Auth 设置中关闭公开注册，并仅手动创建管理员用户。</p></div>
<div id="dashboard" class="hidden"><div class="stats"><div class="stat"><span class="small">全部意向</span><b id="total">0</b></div><div class="stat"><span class="small">待联系</span><b id="pending">0</b></div><div class="stat"><span class="small">洽谈中</span><b id="talking">0</b></div><div class="stat"><span class="small">已签约</span><b id="signed">0</b></div></div>
<div class="panel"><div class="top"><div><h2>意向列表</h2><p class="small">可以搜索、修改跟进状态和内部备注。</p></div><button class="btn secondary" id="refreshBtn">刷新列表</button></div>
<div class="filters"><input id="search" placeholder="搜索姓名、电话、城市"><select id="statusFilter"><option value="">全部状态</option><option>待联系</option><option>洽谈中</option><option>已签约</option><option>暂不合作</option></select></div>
<div id="listMsg" class="message"></div><div class="tablewrap"><table><thead><tr><th>提交时间</th><th>房东</th><th>电话</th><th>房源</th><th>房型/数量</th><th>期望租期</th><th>补充说明</th><th>跟进状态</th><th>内部备注</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
/* 与 index.html 使用同一个 Supabase 项目。仅放公开 anon/publishable key，绝不可放 service_role key。 */
const SUPABASE_URL="https://tmgvfszgjevsckdhuqyk.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY="sb_publishable_hNxPXuT4UQpwinAWp4pTRg_M6uytmdE";
const warning=document.getElementById("setupWarning"),loginPanel=document.getElementById("loginPanel"),dashboard=document.getElementById("dashboard"),logoutBtn=document.getElementById("logoutBtn");
let db=null, allLeads=[];
if(SUPABASE_URL.startsWith("YOUR_")||SUPABASE_ANON_KEY.startsWith("YOUR_")){warning.classList.remove("hidden");warning.textContent="尚未配置 Supabase。请按 README 将本文件中的 SUPABASE_URL 和 SUPABASE_ANON_KEY 替换为项目值。";}
else{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);db.auth.getSession().then(({data})=>{if(data.session)showDashboard();});}
function message(id,text,kind=""){const el=document.getElementById(id);el.textContent=text;el.className="message "+kind;}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!db)return;const b=document.getElementById("loginBtn");b.disabled=true;message("loginMsg","正在登录…");try{const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error)throw error;await showDashboard();}catch(err){message("loginMsg","登录失败，请检查邮箱、密码及 Supabase 配置。","error");}finally{b.disabled=false;}});
async function showDashboard(){loginPanel.classList.add("hidden");dashboard.classList.remove("hidden");logoutBtn.classList.remove("hidden");await loadLeads();}
logoutBtn.addEventListener("click",async()=>{if(db)await db.auth.signOut();dashboard.classList.add("hidden");loginPanel.classList.remove("hidden");logoutBtn.classList.add("hidden");});
document.getElementById("refreshBtn").addEventListener("click",loadLeads);document.getElementById("search").addEventListener("input",render);document.getElementById("statusFilter").addEventListener("change",render);
async function loadLeads(){message("listMsg","正在加载…");const {data,error}=await db.from("owner_leads").select("*").order("created_at",{ascending:false});if(error){message("listMsg","读取失败：请确认 SQL 已执行、管理员 UID 已写入策略，并已重新登录。","error");return;}allLeads=data||[];render();message("listMsg","已加载 "+allLeads.length+" 条意向。","ok");}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),st=document.getElementById("statusFilter").value;const filtered=allLeads.filter(x=>(!st||x.status===st)&&[x.name,x.phone,x.city,x.details].some(v=>String(v||"").toLowerCase().includes(q)));document.getElementById("total").textContent=allLeads.length;document.getElementById("pending").textContent=allLeads.filter(x=>x.status==="待联系").length;document.getElementById("talking").textContent=allLeads.filter(x=>x.status==="洽谈中").length;document.getElementById("signed").textContent=allLeads.filter(x=>x.status==="已签约").length;
document.getElementById("rows").innerHTML=filtered.map(x=>`<tr><td>${escapeHtml(new Date(x.created_at).toLocaleString("zh-CN"))}</td><td>${escapeHtml(x.name)}</td><td><a href="tel:${escapeHtml(x.phone)}">${escapeHtml(x.phone)}</a></td><td>${escapeHtml(x.city)}</td><td>${escapeHtml(x.property_type)}<br>${escapeHtml(x.rooms||"未填写")}</td><td>${escapeHtml(x.lease_term||"未填写")}</td><td>${escapeHtml(x.details||"—")}</td><td><select id="status-${x.id}">${["待联系","洽谈中","已签约","暂不合作"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select></td><td><textarea id="note-${x.id}" rows="2" maxlength="2000">${escapeHtml(x.admin_note||"")}</textarea></td><td><div class="actions"><button class="btn" onclick="saveLead('${x.id}')">保存</button></div></td></tr>`).join("")||'<tr><td colspan="10">暂无符合条件的意向</td></tr>';}
window.saveLead=async function(id){const status=document.getElementById("status-"+id).value,admin_note=document.getElementById("note-"+id).value;const {error}=await db.from("owner_leads").update({status,admin_note}).eq("id",id);if(error){message("listMsg","保存失败：请检查管理员权限。","error");return;}const item=allLeads.find(x=>x.id===id);if(item){item.status=status;item.admin_note=admin_note;}render();message("listMsg","已保存跟进信息。","ok");};
</script></body></html>
